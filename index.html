<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UniLog</title>
  <meta name="description" content="Organiza tus asignaturas, horario, exámenes, prácticas y notas de la universidad.">

  <!-- Aspecto de app en iPhone / Android -->
  <meta name="theme-color" content="#0c0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UniLog">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Aplica el tema guardado antes de pintar, para que no parpadee -->
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('unilog:v1') || '{}').settings?.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="splashing">
  <!-- Animación de apertura -->
  <div id="splash" aria-hidden="true">
    <div class="sp-logo">
      <svg class="sp-cap" viewBox="0 0 100 100" width="76" height="76" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path class="sp-top" d="M8 38 L50 20 L92 38 L50 56 Z" fill="#7c9cff"/>
        <path class="sp-base" d="M28 47 V63 C28 70 38 75 50 75 C62 75 72 70 72 63 V47 L50 56 Z" fill="#607ce6"/>
        <g class="sp-tassel"><path d="M84 41 V62" stroke="#ffcc4d" stroke-width="4"/><circle cx="84" cy="66" r="5" fill="#ffcc4d"/></g>
      </svg>
      <svg class="sp-check" viewBox="0 0 100 40" width="56" height="22" fill="none">
        <path d="M30 18 L44 30 L70 8" stroke="#3ddc97" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="sp-name">Uni<b>Log</b></div>
    <div class="sp-greet"></div>
  </div>

  <main id="app"></main>

  <!-- Barra inferior de pestañas -->
  <nav id="tabbar" aria-label="Navegación principal">
    <a href="#/inicio" data-tab="inicio">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>
      Hoy
    </a>
    <a href="#/asignaturas" data-tab="asignaturas">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 016.5 2H20v17H6.5A2.5 2.5 0 004 21.5z"/><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/></svg>
      Asignaturas
    </a>
    <a href="#/estudio" data-tab="estudio">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>
      Estudio
    </a>
    <a href="#/agenda" data-tab="agenda">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      Agenda
    </a>
    <a href="#/notas" data-tab="notas">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
      Expediente
    </a>
  </nav>

  <!-- Temporizador de estudio en marcha -->
  <div id="minitimer" hidden></div>

  <div id="overlay" hidden></div>
  <div id="snack" role="status" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
